name: Sync index.html from hol_to_ics_web.html

on:
  push:
    paths:
      - hol_to_ics_web.html
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync index.html
        run: |
          set -euo pipefail
          cp hol_to_ics_web.html index.html

      - name: Commit changes (if any)
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync index.html from hol_to_ics_web.html"
          git push
